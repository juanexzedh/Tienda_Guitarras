<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Guitar Details</title>
    <link rel="stylesheet" href="../../styles/productstyles/prAcoust.css">
    <link rel="stylesheet" href="/styles/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="transparencia">
        <header>
            <a href="/content/ac.html" class="volver-inicio">← Return</a>
            <h1 id="guitarTitle"></h1>
        </header>
        <main class="product-layout">

            <div class="image-box">
                <img id="guitarImage" alt="Guitar image">
            </div>
            <div class="spec-box">
                <h2>Specifications</h2>
                <ul id="specs">
                    <!-- se generan con JS -->
                </ul>
                <button class="buy-btn">Buy Now!</button>
            </div>
        </main>

        <section class="video-box">
            <h2>Review</h2>
            <iframe id="reviewVideo" width="100%" height="400" frameborder="0" allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </section>
        
    </div>
    <script src="../../jvscript/product.js"></script>
</body>
</html>
